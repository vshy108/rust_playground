[package]
name = "rust_playground"
version = "0.1.0"
edition = "2024"
default-run = "rust_playground"

# cargo build or run will help install
# Dependencies are downloaded and compiled automatically on first `cargo build`.
# To add a new dependency: `cargo add <crate>` (updates this file automatically).
# To add with features:    `cargo add <crate> --features <feature1>,<feature2>`
[dependencies]
# cargo add axum
# Async HTTP web framework built on top of tokio and tower. Used by url_shortener.
axum = "0.8.9"

# cargo add notify
# Cross-platform filesystem watching. Used by file_watcher_cli to detect create/
# modify/delete events and feed them into the channel -> receive loop pipeline.
notify = "8.2.0"

# cargo add ctrlc
# Installs a Ctrl+C handler. Used by file_watcher_cli to stop the receive loop
# cleanly instead of forcing the process to be killed.
ctrlc = "3"

# cargo add rand
# Random number generation. Used by genpass to pick random characters.
rand = "0.9"

# cargo add regex
# Compiled regex patterns for searching. Used by rgrep.
regex = "1"

# cargo add serde --features derive
# Serialisation/deserialisation framework. `derive` enables #[derive(Serialize, Deserialize)]
# on structs so they can be converted to/from JSON automatically.
serde = { version = "1", features = ["derive"] }

# cargo add serde_json
# JSON support for serde. Provides json!() macro and serde_json::from_str/to_string.
serde_json = "1"

# cargo add tokio --features tokio/full
# Async runtime required by axum. `full` enables all features (net, time, sync, etc.).
# Without tokio, async fn main and async handlers cannot run.
tokio = { version = "1.52.3", features = ["full"] }

# cargo add uuid --features v4
# UUID generation. `v4` enables Uuid::new_v4() which generates a random UUID.
# Without the feature flag, only the type is available — generation methods are gated.
uuid = { version = "1.23.2", features = ["v4"] }

# cargo tree: check installed version
# 0.13: rustls, 0.12 and lower: rustls-tls
# rustls: for TLS without OpenSSL (recommended cross-platform)
# json: JSON serialization/deserialization
# is enabled by default. However, because Cargo features are additive, 
# a transitive dependency could still pull in native-tls. 
# To prevent this, explicitly turn off default features
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }

# .layer(TraceLayer::new_for_http())
tower-http = { version = "0.6", features = [
    "trace",
    "timeout",
    "util",
    "request-id",
] }

# networking clients and servers.
tower = "0.5"

# rate limiting
tower_governor = "0.8"

# show tracing log
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# status code
http = "1.4.2"
# terminal
crossterm = "0.29.0"
# gaming audio
rusty_audio = "1.4.1"
# gaming timer
rusty_time = "1.1.0"
# gaming engine
rusty_engine = "7.0.0"

# rusty_engine mimic release profile
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

# [[example]] must stay [[example]] is a Cargo-defined table name
# name should be lowercase letters/numbers with _ or -
# path should point to the .rs file
# cargo run --example random_password_cli
# [[example]]
# name = "random_password_cli"
# path = "projects/completed/random_password_cli.rs"

# cargo run --bin genpass -- --length 20
# cargo install --path .
[dev-dependencies]
tempfile = "3.27.0"
# cargo add tower --dev --features util
# ServiceExt adds .oneshot() which sends a single request to a Router in tests.
tower = { version = "0.5", features = ["util"] }

